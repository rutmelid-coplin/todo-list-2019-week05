<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <title>Todo List</title>
    <link rel="stylesheet" href="todolist.css">
</head>

<body>
    <div class="container">
        <h1>Todo List</h1>
        <h2>Keep up with your tasks!</h2>
        <div class="toDo">
            <textarea id="toDoInput" placeholder="Add a new task" rows="10" cols="100" required></textarea>
            <button type="button" id="addTaskButton">Add</button>
        </div>
        <ul id="todoList"></ul>
    </div>

    <script src="todolist.js"></script>
</body>

</html>
